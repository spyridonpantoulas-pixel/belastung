# Wöchentliche, verschlüsselte Sicherung der Teamdaten aus Supabase.
# Einmalig einrichten (Settings → Secrets and variables → Actions → New repository secret):
#   BACKUP_PASSWORD    langes eigenes Passwort, mindestens 12 Zeichen – gut aufbewahren!
#   MED_PIN            optional: Medizin-PIN, dann werden auch die Arztakten gesichert
# Projekt-Adresse und anon-Schlüssel kommen aus dem Team-Link (t/index.html). Nur wenn sich der
# Zugang einmal ändert und t/index.html nicht mit, SUPABASE_URL und SUPABASE_ANON_KEY als Secrets setzen.
# Die Sicherung liegt danach 90 Tage unter Actions → Sicherung → jeweiliger Lauf → Artifacts.
name: Sicherung
on:
  schedule:
    - cron: "17 3 * * 1"   # montags 03:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sicherung:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sichern und verschlüsseln
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
          MED_PIN: ${{ secrets.MED_PIN }}
        run: node scripts/sicherung.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sicherung-${{ github.run_number }}
          path: sicherung/*.json.enc
          retention-days: 90
          if-no-files-found: error
