<!DOCTYPE html>

<script>
  var ZIEL = "https://spyridonpantoulas-pixel.github.io/belastung/#fcs=eyJ1IjoiaHR0cHM6Ly9xb3NyZWdkdG5yenVzbGhlc3piYy5zdXBhYmFzZS5jbyIsImsiOiJleUpoYkdjaU9pSklVekkxTmlJc0luUjVjQ0k2SWtwWFZDSjkuZXlKcGMzTWlPaUp6ZFhCaFltRnpaU0lzSW5KbFppSTZJbkZ2YzNKbFoyUjBibko2ZFhOc2FHVnplbUpqSWl3aWNtOXNaU0k2SW1GdWIyNGlMQ0pwWVhRaU9qRTNPRFl6TlRrMU56SXNJbVY0Y0NJNk1qRXdNVGt6TlRVM01uMC41ZHYwZnVtRDl1dEQ0dHZPV1hBN2VkclVZdUY0ZGI5VktDSmNZUzRFT2FjIiwidCI6ImZjcy1saWdhIn0";
  // In einem Vorschaufenster (iframe) darf die Seite oft nicht weiterleiten.
  // Dann zeigen wir sofort den Knopf, statt es still zu versuchen.
  var imRahmen = (function(){ try { return window.top !== window.self; } catch (e) { return true; } })();
  if (!imRahmen) {
    try { location.replace(ZIEL); } catch (e) { try { location.href = ZIEL; } catch (e2) {} }
  }
</script>
<style>
  :root{ color-scheme: dark; }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:#0e1014;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .box{max-width:400px;text-align:center}
  .crest{
    width:56px;height:56px;border-radius:16px;margin:0 auto 16px;
    background:linear-gradient(145deg,#3987e5,#1c5cab);
    display:grid;place-items:center;font-weight:700;font-size:20px;
    box-shadow:0 4px 18px rgba(57,135,229,0.3);
  }
  h1{font-size:19px;margin:0 0 6px;letter-spacing:-0.01em}
  p{font-size:13.5px;line-height:1.6;color:#b8bfcc;margin:0 0 20px}
  a.btn{
    display:inline-block;padding:14px 24px;border-radius:12px;background:#3987e5;color:#fff;
    text-decoration:none;font-weight:660;font-size:15px;
  }
  .hint{font-size:11.5px;color:#868e9e;margin-top:20px;line-height:1.6}
  .adr{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#868e9e;
    word-break:break-all;margin-top:14px;line-height:1.5;
  }
  .dots span{
    display:inline-block;width:7px;height:7px;border-radius:50%;background:#3987e5;margin:0 3px;
    animation:pulse 1.2s infinite;
  }
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
</style>
</head>
<body>
  <div class="box">
    <div class="crest">FCS</div>
    <h1>Belastungssteuerung</h1>
    <p id="status">Verbinde mit dem Team <span class="dots"><span></span><span></span><span></span></span></p>
    <a class="btn" id="go" href="https://spyridonpantoulas-pixel.github.io/belastung/#fcs=eyJ1IjoiaHR0cHM6Ly9xb3NyZWdkdG5yenVzbGhlc3piYy5zdXBhYmFzZS5jbyIsImsiOiJleUpoYkdjaU9pSklVekkxTmlJc0luUjVjQ0k2SWtwWFZDSjkuZXlKcGMzTWlPaUp6ZFhCaFltRnpaU0lzSW5KbFppSTZJbkZ2YzNKbFoyUjBibko2ZFhOc2FHVnplbUpqSWl3aWNtOXNaU0k2SW1GdWIyNGlMQ0pwWVhRaU9qRTNPRFl6TlRrMU56SXNJbVY0Y0NJNk1qRXdNVGt6TlRVM01uMC41ZHYwZnVtRDl1dEQ0dHZPV1hBN2VkclVZdUY0ZGI5VktDSmNZUzRFT2FjIiwidCI6ImZjcy1saWdhIn0">App öffnen</a>
    <p class="hint" id="hinweis">
      Diese Seite auf den Startbildschirm legen — dann bist du jedes Mal automatisch
      mit dem Team verbunden.
    </p>
    <p class="adr" id="adresse"></p>
  </div>

  <script>
    var go = document.getElementById("go");
    go.href = ZIEL;
    if (imRahmen) {
      go.target = "_blank";
      go.rel = "noopener";
      document.getElementById("status").innerHTML =
        "Du siehst diese Seite in einem Vorschaufenster. Dort kann nicht automatisch weitergeleitet werden.";
      document.getElementById("hinweis").innerHTML =
        "Tippe auf den Knopf oder öffne die Adresse direkt im Browser deines Handys:";
      document.getElementById("adresse").textContent = location.href.split("#")[0];
    } else {
      setTimeout(function(){
        var st = document.getElementById("status");
        if (st) st.innerHTML = "Falls es nicht automatisch weitergeht:";
      }, 3000);
    }
  </script>
</body>
</html>
